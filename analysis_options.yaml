include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    # Drift schema tooling output (APP-006); not hand-maintained.
    - test/data/generated_migrations/**

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: true
