name: zero_cart
description: "Offline-first shopping-list app for Android and iOS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: 18.1.4
  intl: ^0.20.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/DynaPuff-OFL.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: DynaPuff
      fonts:
        - asset: assets/fonts/DynaPuff-Bold.ttf
          weight: 700
