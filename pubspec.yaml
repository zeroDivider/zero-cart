name: zero_cart
description: "Offline-first shopping-list app for Android and iOS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/DynaPuff-OFL.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: DynaPuff
      fonts:
        - asset: assets/fonts/DynaPuff-Bold.ttf
          weight: 700
