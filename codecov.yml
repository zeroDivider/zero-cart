# Coverage upload config. Thresholds are informational only — CI does not
# fail on coverage % (docs/testing-strategy.md).
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "**/*.g.dart"
  - "lib/l10n/generated/**"
  - "test/**"
  - "tool/**"
